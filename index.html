<title>아지트 광산</title>
<meta name="claude:viewport-fit-sides" content="cover">

<!-- Served from our own host there is no wrapper, so the document needs its own
     head. Without the viewport line a phone lays the page out at desktop width. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3029">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아지트">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* Three portrait screens side by side, swiped like phone home screens:
     pasture, mine (home), agit. Single committed look, so no second theme. */
  :root {
    --rock-deep:   #3b3029;
    --floor:       #c79a68;
    --gem-core:    #a86ad6;
    --gem-light:   #d7a9f2;
    --gem-dark:    #6c3f96;
    --gem-glint:   #fdf3ff;
    --shard:       #e8c7ff;
    --gold:        #f4c45a;
    --grass:       #7a9c4a;
    --grass-dark:  #55722f;
    --soil:        #8a6440;
    --cream:       #fdf6e7;
    --ink:         #3a2a20;
    --glass:    rgba(253, 246, 231, .13);
    --jar-line: rgba(253, 246, 231, .82);
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }

  /* The published artifact wrapper supplies these; a plain file server does not,
     so declare them here and both render identically. */
  [hidden] { display: none !important; }
  img { max-width: 100%; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--rock-deep);
    color: var(--cream);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage { position: relative; height: 100%; width: 100%; overflow: hidden; }

  /* --- the pages --- */
  .pager {
    display: flex;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    touch-action: pan-x;
    overscroll-behavior-x: contain;
  }
  .pager::-webkit-scrollbar { display: none; }
  .page {
    position: relative;
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Dots told her only that three pages exist. Pictures tell her what is over
     there, and tapping one gets her there without knowing about swiping. */
  .tabs {
    position: absolute;
    left: 50%;
    bottom: calc(7px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(26, 20, 16, .55);
    border: 2px solid rgba(253, 246, 231, .2);
    backdrop-filter: blur(6px);
    z-index: 4;
  }
  .tab {
    width: 60px; height: 52px;
    display: grid; place-items: center;
    gap: 1px;
    padding: 0;
    font-family: var(--font-display);
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(253, 246, 231, .62);
    cursor: pointer;
  }
  .tab.on { background: var(--cream); color: var(--ink); }
  .tab b { font-size: 11px; font-weight: 400; line-height: 1; }
  .tab:active { transform: scale(.93); }
  .tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .tab.nudge { color: var(--gold); animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  /* first launch only: say hello so she notices there is something down here.
     Keeps the centring translate, which a bare scale() would throw away. */
  .tabs.hello { animation: hello 1.1s ease-in-out 2; }
  @keyframes hello {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.13); }
  }

  /* --- mine --- */
  .shaker {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr auto;
  }
  .shaker.shake { animation: shake .16s steps(2) 1; }
  .shaker.shake-big { animation: shakeBig .34s ease-out 1; }
  @keyframes shake {
    0%, 100% { transform: translate3d(0, 0, 0); }
    25%      { transform: translate3d(-3px, 2px, 0); }
    75%      { transform: translate3d(3px, -2px, 0); }
  }
  @keyframes shakeBig {
    0%   { transform: translate3d(0, 0, 0); }
    15%  { transform: translate3d(-10px, 6px, 0) rotate(-.6deg); }
    35%  { transform: translate3d(9px, -5px, 0) rotate(.5deg); }
    55%  { transform: translate3d(-6px, 3px, 0) rotate(-.3deg); }
    75%  { transform: translate3d(4px, -2px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  /* the agit seen far off through the cave mouth - it grows with the real one */
  #distantAgit {
    position: absolute;
    transform: translate(-50%, -55%);
    pointer-events: none;
    width: 0;             /* set from script once the background has laid out */
    filter: saturate(.72) brightness(.88) drop-shadow(0 2px 3px rgba(0, 0, 0, .4));
  }
  #distantAgit.grew { animation: grew 1.5s ease-out 1; }
  @keyframes grew {
    0%   { transform: translate(-50%, -55%) scale(.4); filter: saturate(1.4) brightness(2); }
    45%  { transform: translate(-50%, -55%) scale(1.14); }
    100% { transform: translate(-50%, -55%) scale(1); }
  }

  .arena {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  /* nudged below centre: it sits in thumb reach on a big phone, and it fills the
     empty stretch of cave floor between the gem and the crowd */
  .gembox { position: relative; display: grid; place-items: center; transform: translateY(11%); }
  #gem {
    width: min(52vw, 42vh);
    height: auto;
    max-width: 100%;
    overflow: visible;
    cursor: pointer;
    touch-action: pan-x;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45));
    transform-origin: 50% 62%;
    transition: transform .09s cubic-bezier(.3, 1.6, .5, 1);
  }
  #gem.squash { transform: scale(1.1, .88) translateY(3%); transition-duration: .05s; }
  #gem.pop    { transform: scale(1.22); transition-duration: .12s; }
  #gem.drop   { animation: drop .5s cubic-bezier(.2, 1.5, .4, 1) 1; }
  @keyframes drop {
    0%   { transform: translateY(-34%) scale(.3); opacity: 0; }
    60%  { transform: translateY(0) scale(1.08); opacity: 1; }
    100% { transform: translateY(0) scale(1); }
  }

  #gem.sparkle {
    --gem-core:  #efb13c;
    --gem-light: #ffe9a8;
    --gem-dark:  #bf7714;
    --gem-glint: #fffdf2;
    animation: gemGlow 1.2s ease-in-out infinite;
  }
  @keyframes gemGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 205, 100, .45)) drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
    50%      { filter: drop-shadow(0 0 26px rgba(255, 215, 130, .9))  drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
  }
  /* the glow rule would otherwise replace the drop outright, and the gold gem -
     the one arrival that should land hardest - would just blink into place */
  #gem.sparkle.drop {
    animation: drop .5s cubic-bezier(.2, 1.5, .4, 1) 1, gemGlow 1.2s ease-in-out infinite;
  }
  /* a shadow, never the friend: the shape hints at who it is, the colours do not */
  #inmate { opacity: 0; filter: brightness(0) saturate(0); }
  #gem.sparkle #inmate { opacity: .42; animation: sway 2.6s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: translateX(-2px) rotate(-1.5deg); }
    50%      { transform: translateX(2px) rotate(1.5deg); }
  }

  .twinkles { position: absolute; inset: -12%; pointer-events: none; opacity: 0; }
  .twinkles.on { opacity: 1; }
  .twinkles i {
    position: absolute;
    width: 14px; height: 14px;
    background: radial-gradient(circle, #fff 0 22%, rgba(255, 228, 160, .95) 38%, transparent 70%);
    animation: tw 1.5s ease-in-out infinite;
  }
  @keyframes tw {
    0%, 100% { transform: scale(.3) rotate(0deg); opacity: .2; }
    50%      { transform: scale(1) rotate(90deg); opacity: 1; }
  }

  .crack { opacity: 0; }
  .crack.on { opacity: 1; }

  #flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 44%, #fff 0%, rgba(255, 255, 255, .7) 22%, transparent 62%);
    opacity: 0;
    pointer-events: none;
  }
  #flash.go { animation: flash .34s ease-out 1; }
  /* warm gold rather than a full white blast - this plays in a dark room */
  #flash.big {
    background: radial-gradient(circle at 50% 44%, #fffaf0 0%, rgba(255, 226, 158, .72) 26%, transparent 66%);
    animation: flash .72s ease-out 1;
  }
  @keyframes flash {
    0%   { opacity: 0; transform: scale(.5); }
    12%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* canvas is a replaced element: without an explicit CSS size it lays out at its
     backing-store size and spills past the page */
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #reveal {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform, filter;
  }
  #reveal img { display: block; height: 100%; width: auto; max-width: none; }
  #reveal.dark img { filter: brightness(0) saturate(0); }
  #reveal.lit  img { filter: none; transition: filter .45s ease-out; }

  /* Animals and friends share the floor. One row made a crowd of nine shrink to
     ankle height; two rows with the back one smaller and hazier keeps everyone
     recognisable and reads as a crowd instead of a line of specks. */
  .ground {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* clears the tab bar, which the crowd must stand above */
    padding-block: 0 calc(80px + env(safe-area-inset-bottom, 0px));
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    min-width: 0;
  }
  .rowLine {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(2px, 1.5vw, 10px);
    min-width: 0;
  }
  .rowLine.back {
    margin-bottom: -14px;          /* the front row laps over their feet */
    transform: translateX(12px);   /* and stands off-centre, so nobody is hidden */
    filter: brightness(.84) saturate(.92);
  }
  .rowLine img {
    height: var(--h, 88px);
    width: auto;
    display: block;
    transform-origin: 50% 100%;
    animation: bob 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35));
  }
  .rowLine img.pet { height: calc(var(--h, 88px) * .78); animation-duration: 2.1s; }
  .rowLine img:nth-child(2n) { animation-delay: -.5s; }
  .rowLine img:nth-child(3n) { animation-delay: -.9s; }
  /* Independent translate/scale, never `transform`: a keyframe that sets
     transform REPLACES the element's own, and .yard img / .beast both rely on
     transform: translate(-50%, -100%) to stand on their feet. They did not,
     which is why the ending photograph cropped the back row off at the knees. */
  @keyframes bob {
    0%, 100% { translate: 0 0;    scale: 1 1; }
    50%      { translate: 0 -4px; scale: 1 1.02; }
  }
  .rowLine img.swing { animation: swing .22s ease-out 1; }
  @keyframes swing {
    0%   { transform: rotate(0) translateY(0); }
    35%  { transform: rotate(-16deg) translateY(-6px); }
    70%  { transform: rotate(9deg) translateY(1px) scaleY(.96); }
    100% { transform: rotate(0) translateY(0); }
  }
  .rowLine img.act { animation: lunge .4s ease-out 1; }
  @keyframes lunge {
    0%   { transform: translate(0, 0) scaleX(1); }
    30%  { transform: translate(14px, -10px) scaleX(1.06) rotate(-8deg); }
    60%  { transform: translate(4px, 2px) scaleY(.92); }
    100% { transform: translate(0, 0); }
  }

  .jar {
    position: absolute;
    left: max(14px, env(safe-area-inset-left, 0px));
    top: max(14px, env(safe-area-inset-top, 0px));
    width: 68px;          /* it is the only progress she has; make it readable */
    pointer-events: none;
    filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .45));
  }
  .jar.full { animation: jarPulse .7s ease-in-out 2; }
  @keyframes jarPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.14); }
  }
  /* fill-box, or `100%` means the bottom of the whole viewBox (y=72) rather
     than the bottom of this rect (y=68), and the level reads a few px high */
  #jarFill {
    transition: transform .45s cubic-bezier(.3, 1.3, .5, 1);
    transform-origin: 50% 100%;
    transform-box: fill-box;
  }

  /* --- the mine, out of rock for today --- */
  /* She is never locked out: the pasture and the agit stay fully alive, there is
     just nothing left to break. Having nothing to do is what ends a session
     kindly; being shut out is what makes a child want back in. */
  #pageMine.asleep .shaker::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(16, 20, 52, .74), rgba(9, 11, 32, .86));
  }
  #pageMine.asleep .rowLine img {
    animation-duration: 5s;
    filter: brightness(.62) drop-shadow(0 4px 6px rgba(0, 0, 0, .45));
  }
  #zzz {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: flex-end;
    gap: 6px;
    pointer-events: none;
    color: rgba(253, 246, 231, .82);
  }
  #zzz i {
    font-style: normal;
    font-size: 26px;
    animation: snooze 2.6s ease-in-out infinite;
  }
  #zzz i:nth-child(2) { font-size: 34px; animation-delay: .5s; }
  #zzz i:nth-child(3) { font-size: 44px; animation-delay: 1s; }
  @keyframes snooze {
    0%        { transform: translateY(14px) rotate(-8deg); opacity: 0; }
    30%, 60%  { opacity: .9; }
    100%      { transform: translateY(-34px) rotate(10deg); opacity: 0; }
  }

  /* --- pasture --- */
  /* Its own class, not the agit's .yard: sharing it meant `.yard img` was
     absolutely positioning the animals' images out of their boxes, which left
     every animal zero-width, off its spot, and the far one off the screen. */
  .field { position: absolute; inset: 0; }
  .plot {
    position: absolute;
    transform: translate(-50%, -100%);
    width: 74px; height: 56px;
    display: grid;
    place-items: end center;
    cursor: pointer;
  }
  /* bare earth while empty, a green mound once something is growing in it */
  .plot .soil {
    position: absolute;
    left: 50%; bottom: 0;
    width: 74px; height: 24px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: var(--soil);
    border: 2px solid var(--ink);
    opacity: .92;
  }
  .plot.sown .soil { background: #6b8e42; }
  .plot.ready .soil { background: #7f9c41; }
  .plot .blades {
    position: relative;
    display: flex; align-items: flex-end;
    gap: 3px; height: 100%;
    padding-bottom: 9px;
    transform-origin: 50% 100%;
  }
  /* she will poke the growing grass; silence reads as broken */
  .plot .blades.rustle { animation: rustle .45s ease-out 1; }
  @keyframes rustle {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-5deg); }
    60%      { transform: rotate(4deg); }
  }
  /* short and wide, not tall and thin: thin dark blades read as a bundle of
     twigs at this size, which is not what a patch of grass looks like */
  .plot .blades i {
    display: block;
    width: 10px;
    height: calc(7px + var(--g, 0) * 7.5px);
    border-radius: 6px 6px 2px 2px;
    background: #b4d16e;
    border: 1.5px solid #3f5a24;
    box-sizing: border-box;
    transform-origin: 50% 100%;
    transition: height .4s cubic-bezier(.3, 1.4, .5, 1);
  }
  .plot .blades i:nth-child(odd) { background: #9cbf57; transform: rotate(-7deg); }
  .plot .blades i:nth-child(3n)  { transform: rotate(6deg); }
  .plot .seed {
    position: absolute;
    bottom: 2px; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 44px;       /* the only thing to do on this page: make it obvious */
    border-radius: 50%;
    background: rgba(253, 246, 231, .9);
    border: 3px solid var(--ink);
    box-shadow: 0 3px 6px rgba(0, 0, 0, .25);
    color: var(--ink);
    font-size: 30px;
    line-height: 38px;
    text-align: center;
    /* its own keyframes: the shared nudge sets a bare scale(), which replaces
       the centring translate and shoves the button half its width off the plot */
    animation: seedPulse 1.6s ease-in-out infinite;
  }
  @keyframes seedPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.14); }
  }
  .plot.ready .blades i { background: #efe07c; border-color: #7a6a22; }

  .beast {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    animation: bob 2.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .28));
  }
  .beast img { display: block; height: 100%; width: auto; max-width: none; }
  .beast b, .yard b {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px; font-weight: 400;
    color: var(--ink);
    background: rgba(253, 246, 231, .84);
    border: 1.5px solid rgba(58, 42, 32, .3);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
    pointer-events: none;
  }
  .beast b { bottom: -18px; }
  .beast.waiting { animation: waitHop .9s ease-in-out infinite; }
  .beast.waiting::after {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 226, 150, .55) 0 38%, transparent 70%);
    z-index: -1;
  }
  @keyframes waitHop {
    0%, 100% { transform: translate(-50%, -100%) scaleY(1); }
    45%      { transform: translate(-50%, -116%) scaleY(1.04); }
    60%      { transform: translate(-50%, -100%) scaleY(.94); }
  }
  .heart {
    position: absolute;
    pointer-events: none;
    font-size: 26px;
    animation: heart 1s ease-out forwards;
  }
  @keyframes heart {
    0%   { transform: translate(-50%, 0) scale(.4); opacity: 0; }
    25%  { transform: translate(-50%, -18px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -70px) scale(.9); opacity: 0; }
  }

  /* --- agit --- */
  #agitBuilding {
    position: absolute;
    left: 50%;
    top: 48%;
    width: min(66%, 340px);
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .32));
  }
  #agitBuilding.grew { animation: build .9s cubic-bezier(.2, 1.5, .4, 1) 1; }
  @keyframes build {
    0%   { transform: translate(-50%, -50%) scale(.5) translateY(26px); opacity: 0; }
    55%  { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  .yard { position: absolute; inset: 0; pointer-events: none; }
  .yard b { transform: translate(-50%, -100%); font-size: 11px; padding: 0 6px; }
  .yard img {
    position: absolute;
    height: var(--yard-h, 76px);
    width: auto;
    transform: translate(-50%, -100%);
    animation: bob 1.9s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .3));
  }

  /* On the stage, not inside the agit page: the collection used to be invisible
     until she found the agit, which made finding the agit a prerequisite for
     knowing the collection exists. Bottom corners, level with the tab bar, so
     neither one ever sits over the cave mouth or the jar on the mine. */
  .dexBtn {
    position: absolute;
    right: max(14px, env(safe-area-inset-right, 0px));
    bottom: calc(9px + env(safe-area-inset-bottom, 0px));
    width: 50px; height: 50px;
    display: grid; place-items: center;
    border: 2px solid rgba(58, 42, 32, .35);
    background: rgba(253, 246, 231, .82);
    border-radius: 18px;
    cursor: pointer;
    padding: 0;
    z-index: 4;
  }
  .muteBtn { right: auto; left: max(14px, env(safe-area-inset-left, 0px)); }
  .muteBtn #muteOff { display: none; }
  .muteBtn.off #muteOn { display: none; }
  .muteBtn.off #muteOff { display: inline; }
  .muteBtn.off { background: rgba(253, 246, 231, .45); }
  .dexBtn:active { transform: scale(.94); }
  .dexBtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .dexBtn .badge {
    position: absolute;
    right: -6px; top: -6px;
    min-width: 24px; height: 24px;
    border-radius: 12px;
    background: var(--gold);
    color: var(--ink);
    font-size: 13px;
    display: grid; place-items: center;
    border: 2px solid #6c5a46;
  }

  /* --- the ending: everyone in one photograph --- */
  /* A frame over the agit, not a panel in front of it. The whole point is that
     she can see the six of them and the animals standing together. */
  #ending {
    position: absolute;
    inset: 0;
    z-index: 6;
    cursor: pointer;
  }
  #ending .frame {
    position: absolute;
    inset: 16px calc(16px + env(safe-area-inset-right, 0px))
           calc(84px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    border: 12px solid var(--cream);
    border-bottom-width: 58px;
    border-radius: 4px;

<script>
(function () {
  "use strict";

  var FRIENDS = [
    "art/sprites/char1-green.png",
    "art/sprites/char2-blue.png",
    "art/sprites/char3-pink.png",
    "art/sprites/char4-lilac.png",
    "art/sprites/char5-cream.png",
    "art/sprites/char6-brown.png"
  ];
  var AGIT = ["art/sprites/agit1-camp.png", "art/sprites/agit2-cabin.png", "art/sprites/agit3-farm.png"];

  // every: how often it swings at the gem, ms. 0 means it helps another way.
  var ANIMALS = [
    { src: "art/sprites/animal1-rabbit.png", every: 2300, power: 1, plot: [27, 62], home: [31, 75], size: .82 },
    { src: "art/sprites/animal2-goat.png",   every: 4400, power: 2, plot: [55, 70], home: [57, 83], size: .95 },
    { src: "art/sprites/animal3-deer.png",   every: 0,    power: 0, plot: [78, 58], home: [81, 70], size: 1, shards: 4 }
  ];

  var PET_NAME0 = FRIENDS.length;   // state.names[0..5] friends, [6..8] animals

  /* --- tuning. D6 with the actual kid decides these. --- */
  var CRACK_SLOTS    = 6;
  var BASE_CRACKS    = 4;
  var SHARDS_PER_GEM = 12;
  var JAR_BASE       = 30;
  var JAR_STEP       = 18;
  var STAGE_AT       = [3, 6];   // friends needed for agit stage 2, then stage 3
  var GROW           = 4;        // gems broken to raise a planted patch of grass
  var BLADES         = 5;
  var DAILY_GEMS     = 30;       // one day's seam in the rock; then the mine sleeps
  var DAY_START_HOUR = 4;        // "today" runs 4am to 4am, so a late evening is one day
  var SAVE_KEY       = "agit.save.v1";

  /* where the cave mouth sits inside art/bg-mine.png, as a fraction of the image */
  var CAVE = { x: .735, y: .085, w: .15 };
  /* Where everyone stands in the agit yard: x%, the ground their feet rest on,
     relative size. Kept above 80% so the photo frame's border never crops the
     group, and clear of the house, which sits around 36-62%. */
  var YARD = [[22, 66, 1], [41, 72, 1.05], [60, 67, .95], [78, 71, 1], [31, 79, 1.1], [67, 79, 1.05]];
  /* and where the animals come to stand once everyone is home */
  var YARD_PETS = [[12, 73, .8], [49, 79, .76], [88, 73, .74]];

  var $ = function (id) { return document.getElementById(id); };
  var pager = $("pager"), pageMine = $("pageMine"), shaker = $("shaker");
  var gem = $("gem"), inmate = $("inmate"), twinkles = $("twinkles"), flash = $("flash");
  var ground = $("ground"), rowFront = $("rowFront"), rowBack = $("rowBack");
  var jar = $("jar"), jarFill = $("jarFill"), jarTop = $("jarTop");
  var reveal = $("reveal"), revealImg = $("revealImg");
  var canvas = $("fx"), ctx = canvas.getContext("2d");
  var mineBg = $("mineBg"), distant = $("distantAgit");
  var agitBuilding = $("agitBuilding"), yard = $("yard"), field = $("field");
  var dexBtn = $("dexBtn"), dexBadge = $("dexBadge"), dexPanel = $("dexPanel"), dexGrid = $("dexGrid");
  var muteBtn = $("muteBtn");
  var namePanel = $("namePanel"), nameFace = $("nameFace"), nameInput = $("nameInput");
  var tabs = $("tabs");
  var cracks = Array.prototype.slice.call(document.querySelectorAll(".crack"));
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = {
    found: 1, shards: 0, hits: 0, gems: 0, sparkle: false, busy: false,
    names: [], stageSeen: 1,
    plots: [-1, -1, -1],      // -1 unplanted, otherwise how grown
    animals: [false, false, false],
    taught: false,            // has she been shown that the screen slides
    day: "", todayGems: 0, friendToday: false,
    muted: false,
    done: false               // the photograph has been taken
  };

  /* ---------- one day's worth ----------
     No timer and no countdown. A clock that cuts her off mid-animation teaches
     her the game betrays her; a mine that runs out of rock is an event in the
     world, and finishing it reads as "done for today" instead of "stopped". */
  function dayKey() {
    var t = new Date(Date.now() - DAY_START_HOUR * 3600000);
    return t.getFullYear() + "-" + (t.getMonth() + 1) + "-" + t.getDate();
  }
  function rollDay() {
    var k = dayKey();
    if (state.day === k) return false;
    state.day = k;
    state.todayGems = 0;
    state.friendToday = false;
    save();
    return true;
  }
  function mineAsleep() { return state.todayGems >= DAILY_GEMS; }

  function jarTarget() { return JAR_BASE + JAR_STEP * (state.found - 1); }
  function cracksToBreak() { return BASE_CRACKS + Math.min(4, Math.floor(state.gems / 5)); }
  function crackPerTap() { return 1 + Math.floor((state.found - 1) / 2); }
  function allFound() { return state.found >= FRIENDS.length; }
  function agitStage() {
    if (state.found >= STAGE_AT[1]) return 3;
    if (state.found >= STAGE_AT[0]) return 2;
    return 1;
  }
  function nameOf(i) { return state.names[i] || ""; }
  function waitingAt(i) { return state.plots[i] >= GROW && !state.animals[i]; }
  function anyWaiting() { return waitingAt(0) || waitingAt(1) || waitingAt(2); }
  function ownedCount() {
    var n = 0;
    for (var i = 0; i < ANIMALS.length; i++) { if (state.animals[i]) n++; }
    return n;
  }
  function shardsPerGem() {
    return SHARDS_PER_GEM + (state.animals[2] ? ANIMALS[2].shards : 0);
  }

  /* ---------- save ---------- */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        found: state.found, shards: state.shards, gems: state.gems,
        names: state.names, stageSeen: state.stageSeen,
        plots: state.plots, animals: state.animals, taught: state.taught,
        day: state.day, todayGems: state.todayGems, friendToday: state.friendToday,
        muted: state.muted, done: state.done
      }));
    } catch (e) { /* private window, blocked storage - the game still plays */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      return (o && typeof o.found === "number") ? o : null;
    } catch (e) { return null; }
  }

  /* ---------- sound: everything is synthesised, so nothing has to load ----------
     One master gain sits in front of the speakers: muting is a single switch and
     overlapping sounds cannot stack into clipping. */
  var audio = null, master = null;
  function ac() {
    if (state.muted) return null;
    if (!audio) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { audio = new C(); } catch (e) { return null; }
      master = audio.createGain();
      master.gain.value = .9;
      var squash = audio.createDynamicsCompressor();  // taps come in bursts
      squash.threshold.value = -18;
      squash.ratio.value = 6;
      master.connect(squash);
      squash.connect(audio.destination);
    }
    if (audio.state === "suspended") { audio.resume(); }
    return audio;
  }
  function blip(freq, dur, type, gain, detune) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "triangle";
    // a touch of drift each time, so a hundred taps do not sound like one tone
    var f = freq * (1 + (Math.random() - .5) * (detune === undefined ? .04 : detune));
    o.frequency.setValueAtTime(f, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f * 1.6, a.currentTime + dur);
    g.gain.setValueAtTime(gain || .12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(a.currentTime + dur);
  }
  function chime(notes, step) {
    for (var i = 0; i < notes.length; i++) {
      (function (f, n) { setTimeout(function () { blip(f, .3, "sine", .1, .01); }, n * (step || 110)); })(notes[i], i);
    }
  }
  function noise(dur, cutoff, gain, sweepTo) {
    var a = ac(); if (!a) return;
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2); }
    var src = a.createBufferSource(); src.buffer = buf;

        { transform: at(fromX, fromY - 26, 1.1), offset: .4 },
        { transform: at(fromX, fromY, 1) }
      ], { duration: reduced ? 150 : 440, easing: "ease-out" });
    }

    function runToCrew() {
      state.found = idx + 1;
      renderCrew();
      slot = crewSlot(idx);
      if (!slot) return;
      slot.style.opacity = "0";
      var sr = slot.getBoundingClientRect();
      var toX = sr.left - sRect.left, toY = sr.top - sRect.top;
      var sc = sr.height / tall;
      reveal.animate([
        { transform: at(fromX, fromY, 1) },
        { transform: at((fromX + toX) / 2, fromY + (toY - fromY) * .35 - 30, ((1 + sc) / 2).toFixed(3)), offset: .5 },
        { transform: at(toX, toY, sc.toFixed(3)) }
      ], { duration: RUN, easing: "cubic-bezier(.4,.1,.3,1)", fill: "forwards" });
      blip(880, .18, "sine", .08);
    }

    function finish() {
      if (ended) return;
      ended = true;
      if (state.found === idx) { state.found = idx + 1; renderCrew(); }
      if (slot) { slot.style.opacity = ""; }
      reveal.hidden = true;
      reveal.getAnimations().forEach(function (a) { a.cancel(); });
      renderDex();
      if (agitStage() !== stageBefore) { renderAgit(true); markTabs(currentPage()); }
      save();
      askName(FRIENDS[idx], idx, function () {
        // let the mine reset first, so nothing is left mid-animation behind her
        nextGem();
        if (allFound() && !state.done) {
          state.done = true;
          save();
          playEnding();
        }
      });
    }
  }

  /* ---------- the ending ---------- */
  var ending = $("ending"), confetti = $("confetti"), shutter = ending.querySelector(".shutter");
  // buttons and tabs are not part of the photograph, and she will screenshot it
  function chrome(show) {
    dexBtn.hidden = !show; muteBtn.hidden = !show; tabs.hidden = !show;
  }
  function playEnding() {
    goTo(AGIT_PAGE);
    chrome(false);
    renderYard();                       // the animals join the group for the photo
    setTimeout(function () {
      confetti.innerHTML = "";
      var colours = ["#f4c45a", "#d7a9f2", "#7a9c4a", "#ef8aa0", "#fdf6e7", "#8fc0e8"];
      for (var i = 0; i < 18; i++) {
        var c = document.createElement("i");
        c.style.left = (3 + Math.random() * 94) + "%";
        c.style.background = colours[i % colours.length];
        c.style.animationDelay = (Math.random() * 1.1).toFixed(2) + "s";
        c.style.animationDuration = (2.1 + Math.random() * 1.4).toFixed(2) + "s";
        confetti.appendChild(c);
      }
      ending.hidden = false;
      // the flash fades by animation, but a paused animation would leave the
      // screen white with no way for her to know to tap, so time it out too
      shutter.hidden = false;
      setTimeout(function () { shutter.hidden = true; }, 700);
      buzz([16, 60, 16, 60, 24]);
      chime([523, 659, 784, 1046, 1318], 150);
    }, reduced ? 80 : 700);             // let the page finish sliding first
  }
  ending.addEventListener("click", function () { ending.hidden = true; chrome(true); });
  // she will want to see it again, and the finished agit is where she looks
  agitBuilding.addEventListener("click", function () {
    if (state.done && ending.hidden) { playEnding(); }
  });

  /* ---------- naming: the moment a friend becomes hers ---------- */
  function askName(src, key_, then) {
    nameFace.src = src;
    nameInput.value = nameOf(key_);
    namePanel.hidden = false;
    setTimeout(function () { try { nameInput.focus(); } catch (e) {} }, 60);

    var nameOk = $("nameOk"), nameSkip = $("nameSkip");
    function close() {
      namePanel.hidden = true;
      nameOk.removeEventListener("click", ok);
      nameSkip.removeEventListener("click", close);
      namePanel.removeEventListener("click", backdrop);
      nameInput.removeEventListener("keydown", key);
      document.removeEventListener("keydown", esc);
      if (then) { then(); }
    }
    function ok() {
      var v = nameInput.value.trim();
      if (v) {
        state.names[key_] = v;
        renderDex(); renderYard(); save();
        blip(900, .16, "sine", .09);
      }
      close();
    }
    function backdrop(e) { if (e.target === namePanel) close(); }
    function key(e) { if (e.key === "Enter") { e.preventDefault(); ok(); } }
    function esc(e) { if (e.key === "Escape") { e.preventDefault(); close(); } }

    nameOk.addEventListener("click", ok);
    nameSkip.addEventListener("click", close);
    namePanel.addEventListener("click", backdrop);
    nameInput.addEventListener("keydown", key);
    document.addEventListener("keydown", esc);
  }

  /* ---------- jar ---------- */
  function setJar(level) {
    // SVG presentation attributes take scale(x, y); scaleY() is CSS-only and is
    // rejected outright, which silently left the jar stuck at full.
    jarFill.setAttribute("transform", "scale(1, " + level.toFixed(3) + ")");
    // a bright line on the surface, so the level reads at a glance from across
    // a dark cave instead of being a vague purple smudge
    // the fill's top edge is at y = 68 - 54*level and this rect's own y is 62
    jarTop.setAttribute("transform", "translate(0," + (6 - 54 * level).toFixed(1) + ")");
    jarTop.setAttribute("opacity", level > .02 ? "1" : "0");
  }
  function addShards(n) {
    state.shards += n;
    var target = jarTarget();
    // never bank past a full jar: otherwise one long session buys several days
    // of friends in advance and the one-a-day rhythm stops meaning anything
    state.shards = Math.min(state.shards, target);
    setJar(Math.min(1, state.shards / target));
    if (state.shards >= target && !allFound()) {
      jar.classList.remove("full"); void jar.offsetWidth; jar.classList.add("full");
      setTimeout(function () { jar.classList.remove("full"); }, 1500);
    }
  }

  /* ---------- collection ---------- */
  // Friends first, then the animals. It is also the only place an animal she
  // skipped naming on arrival can still be given one.
  function dexList() {
    var L = [], i;
    for (i = 0; i < FRIENDS.length; i++) { L.push({ src: FRIENDS[i], got: i < state.found, key: i }); }
    for (i = 0; i < ANIMALS.length; i++) { L.push({ src: ANIMALS[i].src, got: !!state.animals[i], key: PET_NAME0 + i }); }
    return L;
  }
  function renderDex() {
    dexGrid.innerHTML = "";
    var L = dexList();
    for (var i = 0; i < L.length; i++) {
      var e = L[i];
      var slot = document.createElement("div");
      slot.className = "slot " + (e.got ? "got" : "locked");
      var img = document.createElement("img");
      img.src = e.src; img.alt = "";
      var cap = document.createElement("span");
      cap.textContent = e.got ? (nameOf(e.key) || "이름 짓기") : "?";
      slot.appendChild(img); slot.appendChild(cap);
      if (e.got) {
        // tapping one lets her name them later, or change her mind
        slot.style.cursor = "pointer";
        (function (o) {
          slot.addEventListener("click", function () {
            dexPanel.hidden = true;
            askName(o.src, o.key, function () { renderDex(); dexPanel.hidden = false; });
          });
        })(e);
      }
      dexGrid.appendChild(slot);
    }
  }

  /* ---------- wiring ---------- */
  gem.addEventListener("pointerdown", function () { hit(); });
  gem.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hit(); }
  });
  function paintMute() {
    muteBtn.classList.toggle("off", state.muted);
    muteBtn.setAttribute("aria-label", state.muted ? "소리 켜기" : "소리 끄기");
  }
  muteBtn.addEventListener("click", function () {
    state.muted = !state.muted;
    paintMute();
    save();
    if (master) { master.gain.value = state.muted ? 0 : .9; }
    if (!state.muted) { blip(660, .12, "sine", .09); }   // say hello on the way back
  });

  dexBtn.addEventListener("click", function () { renderDex(); dexPanel.hidden = false; });
  // The whole game is one localStorage key on a parent's phone. A prompt is ugly
  // and it is also the only share sheet that needs no permission and no network.
  $("dexCode").addEventListener("click", function () {
    var cur = localStorage.getItem(SAVE_KEY) || "";
    var v = window.prompt("저장 코드예요. 복사해서 보관하세요.\n다른 코드를 붙여넣고 확인하면 그걸로 되돌립니다.", cur);
    if (!v || v === cur) return;
    try { JSON.parse(v); } catch (e) { window.alert("코드가 올바르지 않아요."); return; }
    localStorage.setItem(SAVE_KEY, v);
    location.reload();
  });
  $("dexClose").addEventListener("click", function () { dexPanel.hidden = true; });
  dexPanel.addEventListener("click", function (e) { if (e.target === dexPanel) dexPanel.hidden = true; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && namePanel.hidden) dexPanel.hidden = true;
  });
  // Wiping every friend she has collected is the single worst thing this game
  // can do, and it sat one stray tap away. Now it takes two deliberate taps.
  // The design doc forbids taking her friends away and this button does exactly
  // that, so it is a parent's control sitting in a child's panel. It stays -
  // somebody has to be able to start over - but a tap can no longer reach it:
  // arming needs a deliberate 1.2s hold, and confirming still needs a second tap.
  var resetBtn = $("dexReset"), resetArmed = 0, resetTimer = null, holdTimer = null;
  function disarmReset() {
    resetArmed = 0;
    resetBtn.textContent = "처음부터(길게)";
    resetBtn.classList.remove("danger");
  }
  resetBtn.addEventListener("pointerdown", function () {
    if (resetArmed) return;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () {
      resetArmed = 1;
      resetBtn.textContent = "정말 다 지울까?";
      resetBtn.classList.add("danger");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(disarmReset, 4000);
    }, 1200);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
    resetBtn.addEventListener(ev, function () { clearTimeout(holdTimer); });
  });
  resetBtn.addEventListener("click", function () {
    if (!resetArmed) return;       // a plain tap never arms it
    clearTimeout(resetTimer);
    disarmReset();
    state.found = 1; state.shards = 0; state.gems = 0; state.hits = 0;
    state.names = []; state.stageSeen = 1;
    state.plots = [-1, -1, -1]; state.animals = [false, false, false];
    state.day = dayKey(); state.todayGems = 0; state.friendToday = false;
    state.done = false; ending.hidden = true; chrome(true);
    wakeMine();
    setSparkle(false); setJar(0); renderCrew(); renderDex(); renderAgit(false);
    renderField(); showCracks(0); markTabs(currentPage()); save();
    dexPanel.hidden = true;
  });
  // capture phase, so any other tap in the panel calms the button down first -
  // but never the button's own second tap, which would re-arm it forever
  dexPanel.addEventListener("click", function (e) {
    if (e.target !== resetBtn) disarmReset();
  }, true);

  function relayout() { sizeCanvas(); placeDistant(); renderYard(); renderField(); }

  // Phones fire resize constantly as the URL bar slides away, and a full rebuild
  // restarts every bob animation and wipes any heart in flight. Only the width
  // actually changes the layout, so height-only changes get the cheap path.
  var lastW = -1, resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      sizeCanvas();
      placeDistant();
      var w = pageMine.clientWidth;
      if (w !== lastW) { lastW = w; renderYard(); renderField(); }
    }, 150);
  });
  mineBg.addEventListener("load", placeDistant);
  setInterval(animalTick, 350);

  // the seam refills on its own, including while she has the app open
  function checkDay() {
    if (!rollDay()) return;
    if (pageMine.classList.contains("asleep")) {
      wakeMine();
      if (!state.busy) { nextGem(); }
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) checkDay();
  });
  setInterval(checkDay, 60000);

  function start(saved) {
    var s = saved && saved.found ? saved : load();
    if (s) {
      state.found = Math.min(FRIENDS.length, Math.max(1, s.found | 0));
      state.shards = Math.max(0, s.shards | 0);
      state.gems = Math.max(0, s.gems | 0);
      state.names = Array.isArray(s.names) ? s.names : [];
      state.stageSeen = Math.max(1, Math.min(3, s.stageSeen | 0 || 1));
      if (Array.isArray(s.plots) && s.plots.length === 3) { state.plots = s.plots; }
      if (Array.isArray(s.animals) && s.animals.length === 3) { state.animals = s.animals; }
      state.taught = !!s.taught;
      state.day = typeof s.day === "string" ? s.day : "";
      state.todayGems = Math.max(0, s.todayGems | 0);
      state.friendToday = !!s.friendToday;
      state.muted = !!s.muted;
      state.done = !!s.done;
    }
    rollDay();
    paintMute();
    buildTwinkles();
    renderCrew();
    renderDex();
    renderAgit(false);
    relayout();
    setJar(Math.min(1, state.shards / jarTarget()));
    if (mineAsleep()) { sleepMine(); }
    else { setSparkle(!allFound() && !state.friendToday && state.shards >= jarTarget()); }
    lastW = pageMine.clientWidth;
    home();
    // if the first layout pass had no width yet, the line above parked us on the
    // pasture; she must always open on the mine, so claim it again once settled
    window.addEventListener("load", home);
    setTimeout(home, 200);
    if (!state.taught) { setTimeout(teachSwipe, 1100); }
  }
  function home() {
    // the highlight is not a layout question, so it is set either way
    markTabs(MINE);
    if (!pager.clientWidth) return;
    pager.scrollLeft = MINE * pager.clientWidth;
  }

  // The first time she opens the game, rock the screen sideways once so she sees
  // the edges of the other two pages move. Nobody has to read anything, and it
  // never happens again. Stepped by a timer, not rAF, because a page that is not
  // being drawn would otherwise leave the pager parked off-centre.
  function teachSwipe() {
    state.taught = true;
    save();
    // she already found it on her own - do not yank the screen out from under her
    if (reduced || currentPage() !== MINE) return;
    // two independent hints, because either one alone can be missed: the tab bar
    // waves, and the pages themselves rock so she sees they slide
    tabs.classList.remove("hello"); void tabs.offsetWidth; tabs.classList.add("hello");
    setTimeout(function () { tabs.classList.remove("hello"); }, 2400);
    var w = pager.clientWidth;
    if (!w) return;
    var base = MINE * w, amp = w * .17, frames = [], i;
    for (i = 1; i <= 9; i++)  { frames.push(base - amp * Math.sin(i / 9 * Math.PI)); }
    for (i = 1; i <= 9; i++)  { frames.push(base + amp * Math.sin(i / 9 * Math.PI)); }
    frames.push(base);
    var k = 0, snap = pager.style.scrollSnapType;
    pager.style.scrollSnapType = "none";   // snapping would fight a partial scroll
    var t = setInterval(function () {
      if (k >= frames.length) {
        clearInterval(t);
        pager.style.scrollSnapType = snap;
        pager.scrollLeft = base;
        markTabs(MINE);
        return;
      }
      pager.scrollLeft = frames[k++];
    }, 36);
  }

  // Added to the home screen it has to open with no network. Nothing here
  // changes often enough to need anything cleverer than cache-first.
  if (navigator.serviceWorker && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () {
      return {
        found: state.found, shards: state.shards, gems: state.gems,
        names: state.names, stageSeen: state.stageSeen,
        plots: state.plots, animals: state.animals
      };
    });
    if (window.claude.hot.ready) { window.claude.hot.ready(start); }
    else { start(window.claude.hot.data || {}); }
  } else {
    start({});
  }
})();
</script>
